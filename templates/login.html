<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Login - Digital Village Office</title>
</head>
<body class="bg-slate-50 font-sans min-h-screen flex items-center justify-center relative">

    <div class="absolute top-6 right-6">
        <a href="/register" class="bg-white text-blue-600 border border-blue-600 px-6 py-2 rounded-full font-semibold hover:bg-blue-50 transition">
            Register
        </a>
    </div>

    <main class="w-full max-w-md p-8 bg-white rounded-3xl shadow-xl border border-slate-100">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-blue-900">Welcome Back</h1>
            <p class="text-slate-500 mt-2">Access the Village Services Portal</p>
        </div>

        <form action="/login" method="POST" class="space-y-6">
            <div>
                <label class="block text-sm font-semibold text-slate-600 mb-2 uppercase tracking-wider">User ID</label>
                <input type="text" name="user_id" placeholder="Enter your User ID" required
                    class="w-full p-4 rounded-2xl border-2 border-slate-100 focus:border-blue-500 focus:ring-4 focus:ring-blue-50/50 outline-none transition-all">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-600 mb-2 uppercase tracking-wider">Password</label>
                <input type="password" name="password" placeholder="••••••••" required
                    class="w-full p-4 rounded-2xl border-2 border-slate-100 focus:border-blue-500 focus:ring-4 focus:ring-blue-50/50 outline-none transition-all">
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl shadow-lg shadow-blue-200 transition-all transform hover:scale-[1.01] active:scale-[0.98]">
                Login 🚀
            </button>
        </form>
    </main>

</body>
</html>
