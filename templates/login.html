<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Login - Digital Village Office</title>
</head>
<body class="bg-slate-50 font-sans min-h-screen flex items-center justify-center relative p-4">

    <div class="absolute top-6 right-6">
        <a href="/register" class="bg-white text-blue-600 border border-blue-600 px-6 py-2 rounded-full font-semibold hover:bg-blue-50 transition-all shadow-sm">
            New Registration
        </a>
    </div>

    <main class="w-full max-w-md p-10 bg-white rounded-[2.5rem] shadow-2xl border border-slate-100">
        <div class="text-center mb-10">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-50 rounded-2xl mb-4">
                <span class="text-3xl">🏛️</span>
            </div>
            <h1 class="text-3xl font-extrabold text-blue-900 tracking-tight">Welcome Back</h1>
            <p class="text-slate-500 mt-2 font-medium">Digital Village Services Portal</p>
        </div>

        <form action="/login" method="POST" class="space-y-6">
            
            <div>
                <label class="block text-xs font-bold text-slate-400 mb-2 uppercase tracking-[0.2em]">Username</label>
                <div class="relative">
                    <input type="text" name="username" placeholder="Enter your username (NOT email)" required
                        class="w-full p-4 pl-12 rounded-2xl border-2 border-slate-100 bg-slate-50/50 focus:bg-white focus:border-blue-500 focus:ring-4 focus:ring-blue-100 outline-none transition-all">
                    <span class="absolute left-4 top-4 opacity-40">👤</span>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-400 mb-2 uppercase tracking-[0.2em]">Password</label>
                <div class="relative">
                    <input type="password" name="password" placeholder="••••••••" required
                        class="w-full p-4 pl-12 rounded-2xl border-2 border-slate-100 bg-slate-50/50 focus:bg-white focus:border-blue-500 focus:ring-4 focus:ring-blue-100 outline-none transition-all">
                    <span class="absolute left-4 top-4 opacity-40">🔒</span>
                </div>
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-4 rounded-2xl shadow-xl shadow-blue-200 transition-all transform hover:scale-[1.02] active:scale-[0.98]">
                Login 🚀
            </button>
        </form>

    </main>
</body>
</html>
